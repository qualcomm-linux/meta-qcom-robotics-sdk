# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
    - ci/meta-qcom.yml
    - repo: meta-qcom-arduino
      file: ci/ventuno-q.yml
    - ci/meta-qcom-arduino.yml

# meta-qcom-arduino provides the ventuno-q machine configuration and its
# board-specific recipes, and is included from the machine fragment rather than
# from the distro fragment so the BSP layer only joins BBLAYERS for Arduino
# builds.
#
# ci/meta-qcom-arduino.yml has to stay last. The cross-repo include above pulls
# in meta-qcom-arduino/ci/base.yml, which carries a valueless
# "meta-qcom-arduino:" self-reference, and kas replaces a mapping with a null
# instead of merging into it. A definition listed before that include would be
# dropped and the layer would resolve against this repository instead of the
# BSP checkout.
