header:
  version: 14
  includes:
  - ci/qcom-distro.yml
defaults:
  repos:
    branch: master
repos:
  meta-qcom-robotics-sdk:
    branch: main
  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
    commit: 36d23fedc4c84f2dee486857fc917f866506d047
  meta-qcom-distro:
    url: https://github.com/qualcomm-linux/meta-qcom-distro
    branch: main
    commit: 0fadc6b05fbacbbf11d0ff2b35f12491e196ba24
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:
    patches:
      fix-BSD-license-missing:
        repo: meta-qcom-robotics-sdk
        path: patches/Initial-commit-of-license.patch
    commit: 62d2381bdee1cebb5924f8594f8a9994083d4f7d
  meta-ros:
    url: https://github.com/ros/meta-ros.git
    branch: master
    layers:
      meta-ros-common:
      meta-ros2:
      meta-ros2-jazzy:
    patches:
      qcom-fixes1:
        repo: meta-qcom-robotics-sdk
        path: patches/0001-jazzy-remove-outdated-bbappend-and-patches-of-stomp.patch
      qcom-fixes2:
        repo: meta-qcom-robotics-sdk
        path: patches/0002-jazzy-update-libdir-of-ompl.patch
      qcom-fixes3:
        repo: meta-qcom-robotics-sdk
        path: patches/0003-jazzy-move-some-nav2-and-moveit-packages-out-of-blac.patch
      ament_cmake_py_fix:
        repo: meta-qcom-robotics-sdk
        path: patches/0001-ros2-ament_cmake-add-python-configurations-for-class.patch
      remove-rosbag2-compressionn-zstd-bbappend:
        repo: meta-qcom-robotics-sdk
        path: patches/0001-fix-remove-bbappend-and-patch-for-rosbag2-compressio.patch
    commit: 7c0bded4f8b2962ff1a0e6e74cb622c06f5255ce
local_conf_header:
  resource_limitation: '# Capture the count of cpu cores available from the host.

    CPU_COUNT = "${@oe.utils.cpu_count(at_least=2, at_most=9)}"


    # Number of parallel threads make can run based on cpu cores with a max cap at
    20.

    THREAD_COUNT = "${@oe.utils.cpu_count(at_least=2, at_most=10)}"


    # Determines how many tasks bitbake should run in parallel.

    BB_NUMBER_THREADS ?= "${CPU_COUNT}"


    # Determines how many tasks bitbake should run in parallel during parsing.

    BB_NUMBER_PARSE_THREADS ?= "${CPU_COUNT}"


    # Specifies a maximum CPU pressure threshold for bitbake scheduler to start new
    tasks.

    BB_PRESSURE_MAX_CPU = "800000"


    # Specifies a maximum IO pressure threshold for bitbake scheduler to start new
    tasks.

    BB_PRESSURE_MAX_IO = "800000"


    # Specifies a maximum Memory pressure threshold for bitbake scheduler to start
    new tasks.

    BB_PRESSURE_MAX_MEMORY = "800000"


    # Determines how many processes make should run in parallel when running compile
    tasks.

    PARALLEL_MAKE ?= "-j ${THREAD_COUNT} -l ${THREAD_COUNT}"

    '

distro: qcom-robotics-ros2-jazzy

target:
  - qcom-robotics-image
  - qcom-robotics-proprietary-image
