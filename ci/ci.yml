# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
  - ci/mirror.yml

local_conf_header:
  ci: |
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    FIRMWARE_COMPRESSION:qcom-armv8a = "zst"
    # Workaround needed due https://bugzilla.yoctoproject.org/show_bug.cgi?id=16010
    PACKAGE_CLASSES = "package_rpm"
  git-dl: |
    # Shared git clone dirs get corrupted when jobs on different hosts
    # update them concurrently: keep them job-local and share history
    # through the atomically written git2_*.tar.gz tarballs in DL_DIR.
    GITDIR = "${TMPDIR}/git2"
    BB_GENERATE_MIRROR_TARBALLS = "1"
  git-shallow-kernels: |
    # Every job rebuilding a qcom kernel restores the same multi-gigabyte
    # repository under one DL_DIR lock; nothing needs its history, so fetch
    # it shallow. linux-yocto stays full, kern-tools needs its meta branches.
    BB_GIT_SHALLOW:pn-linux-qcom = "1"
    BB_GIT_SHALLOW:pn-linux-qcom-rt = "1"
    BB_GIT_SHALLOW:pn-linux-qcom-next = "1"
    BB_GIT_SHALLOW:pn-linux-qcom-next-rt = "1"
