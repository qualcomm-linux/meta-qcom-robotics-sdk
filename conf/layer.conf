BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend \
            ${LAYERDIR}/recipes/*/*/*.bb \
            ${LAYERDIR}/recipes/*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes/*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "meta-qcom-robotics-sdk"
BBFILE_PRIORITY_meta-qcom-robotics-sdk = "13"
BBFILE_PATTERN_meta-qcom-robotics-sdk := "^${LAYERDIR}/"
LAYERSERIES_COMPAT_meta-qcom-robotics-sdk = "wrynose"

QRB_ROS_SAMPLE_REV = "08da75d9952ba5d256c55a3773ed58031b187896"

ros_base_prefix = "/usr/ros/${ROS_DISTRO}"
ROS_UNRESOLVED_DEP-libnanoflann-dev:forcevariable = "nanoflann"

ROBIOTICS_LAYER_DIR = "${LAYERDIR}"
COMMON_LICENSE_DIR = "${COREBASE}/meta/files/common-licenses"

# oe-core removed the ambiguous generic "BSD" license file (commit 14d4c007c4) and now
# parses LICENSE strictly as an SPDX expression. Superflore-generated meta-ros recipes
# that still declare bare LICENSE = "BSD" therefore resolve to LicenseRef-BSD with no
# backing file and fail do_populate_lic. Ship the legacy generic text on LICENSE_PATH so
# those recipes keep building without patching thousands of generated recipes one by one.
LICENSE_PATH += "${LAYERDIR}/licenses"

ROBOTICS_PACKAGEGROUP_LIST_DIR = "${DEPLOY_DIR}/packagegroup-lists/${MACHINE_ARCH}"
