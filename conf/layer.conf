BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend \
            ${LAYERDIR}/recipes/*/*/*.bb \
            ${LAYERDIR}/recipes/*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes/*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "meta-qcom-robotics-sdk"
BBFILE_PRIORITY_meta-qcom-robotics-sdk = "13"
BBFILE_PATTERN_meta-qcom-robotics-sdk := "^${LAYERDIR}/"
LAYERSERIES_COMPAT_meta-qcom-robotics-sdk = "wrynose"

QRB_ROS_SAMPLE_REV = "08da75d9952ba5d256c55a3773ed58031b187896"

ros_base_prefix = "/usr/ros/${ROS_DISTRO}"
ROS_UNRESOLVED_DEP-libnanoflann-dev:forcevariable = "nanoflann"

ROBIOTICS_LAYER_DIR = "${LAYERDIR}"

# Route fetches through the CodeLinaro download mirror before hitting the
# upstream SCMs. CI runners start with a cold DL_DIR and cannot reliably reach
# hosts like gitlab.freedesktop.org or github.com (rate limits / timeouts),
# which makes branch-scoped git fetches (e.g. modemmanager, onnxruntime) fail
# with "Unable to find revision ... even from upstream". The mirror holds the
# pre-populated git2 tarballs for the meta-qcom layers, so trying it first makes
# the fetch deterministic and fast.
QLI_BASELINE ?= "main"
QLI_MIRRORS_URI ?= "https://artifacts.codelinaro.org/artifactory/qli-ci/downloads/${QLI_BASELINE}"
PREMIRRORS:prepend = "\
.*://.*/.* ${QLI_MIRRORS_URI}/ \n \
"

ROBOTICS_PACKAGEGROUP_LIST_DIR = "${DEPLOY_DIR}/packagegroup-lists/${MACHINE_ARCH}"
