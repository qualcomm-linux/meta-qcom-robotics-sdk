name: Build Yocto

on:
  workflow_call:
    inputs:
      use_sstate:
        description: "Use SSTATE cache"
        required: false
        default: "true"
        type: string
      skip_if_github_cached:
        required: false
        type: boolean
        default: false
        description: "Skip the build matrix if the github actions cache already records a previously-successful run for the same inputs"
    outputs:
      build_skipped:
        description: "True when the compile matrix was skipped because the github cache recorded a previously-successful build for the same inputs"
        value: ${{ jobs.github-cache-check.outputs.skip_build }}

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CACHE_DIR: /efsx/qli/meta-qcom-robotics-sdk
  KAS_CLONE_DEPTH: 1
  KAS_CONTAINER: ${{ github.workspace }}/kas-container
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:3f3d3257e8d4ca3adfcb2e0025e6da24339fb8d68a6999ca36c37381351582d5 # 5.5-9-g0555188

jobs:
  kas-setup:
    if: github.repository_owner == 'qualcomm-linux'    
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setting up kas-container
        run: |
          KAS_ID=$(docker create ${KAS_CONTAINER_IMAGE})
          docker cp $KAS_ID:/usr/local/bin/kas-container $KAS_CONTAINER
          docker rm $KAS_ID
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          if ! grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" $KAS_CONTAINER ; then
            echo "Version ${LATEST} of kas is available, please update KAS_CONTAINER_IMAGE: $KAS_CONTAINER_IMAGE"
          fi

      - name: Run kas lock
        run: |
          ${KAS_CONTAINER} lock ci/base.yml:ci/qcom-robotics-distro.yml

      - name: Upload kas
        uses: actions/upload-artifact@v6
        with:
          name: kas
          if-no-files-found: error
          path: |
            ci/*.lock.yml
            kas-container

  github-cache-check:
    needs: kas-setup
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ inputs.skip_if_github_cached && steps.restore.outputs.cache-hit == 'true' }}
      run_hash: ${{ steps.hash.outputs.run_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Compute build input hash
        id: hash
        run: |
          # Hash inputs that fully determine the build:
          # - the resolved base.lock.yml produced by `kas lock` (pins every layer)
          # - the meta-qcom-robotics-sdk revision being built, which pins the rest
          LOCK_HASH=$(sha256sum ci/base.lock.yml | cut -d' ' -f1)
          SRC_HASH=$(git rev-parse HEAD)
          RUN_HASH=$(printf '%s\n%s' "$LOCK_HASH" "$SRC_HASH" | sha256sum | cut -d' ' -f1)
          echo "base.lock.yml hash: $LOCK_HASH"
          echo "meta-qcom-robotics-sdk HEAD: $SRC_HASH"
          echo "Combined run hash: $RUN_HASH"
          echo "run_hash=$RUN_HASH" >> "$GITHUB_OUTPUT"

      - name: Look up previous successful build marker in github cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ steps.hash.outputs.run_hash }}
          lookup-only: true

      - name: Report github-cache-check decision
        env:
          SKIP_IF_CACHED: ${{ inputs.skip_if_github_cached }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RUN_HASH: ${{ steps.hash.outputs.run_hash }}
        run: |
          if [ "${SKIP_IF_CACHED}" != "true" ]; then
            echo "skip_if_github_cached not set; build will run"
          elif [ "${CACHE_HIT}" = "true" ]; then
            echo "Run cache hit on key build-success, hash ${RUN_HASH}: skipping build matrix"
          else
            echo "No previous successful build run recorded in github cache for this hash: build will run"
          fi

  yocto-run-checks:
    needs: [kas-setup, github-cache-check]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      needs.github-cache-check.outputs.skip_build != 'true'
    
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Setting up kas-container
        run: |
          chmod +x $KAS_CONTAINER

      - name: Run yocto-check-layer
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh

      - name: Run Yocto patchreview
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh

  compile-env:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: ubuntu-latest
    outputs:
      CACHE_DIR: ${{ steps.compile_env.outputs.CACHE_DIR }}
    steps:
      - name: Setup compile variables
        id: compile_env
        run: |
          echo "CACHE_DIR=${CACHE_DIR}" >> $GITHUB_OUTPUT

  # Fetches the sources of all the compile jobs and builds the catchall
  # proprietary image first, so the other compile jobs reuse its native
  # tools, toolchain and packages instead of each building them at the same
  # time.
  compile_stage1:
    needs: [kas-setup, github-cache-check, yocto-run-checks, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      needs.github-cache-check.outputs.skip_build != 'true'
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ./.github/workflows/compile.yml
    with:
      machine: iq-9075-evk
      distro_yaml: 'ci/qcom-robotics-distro-catchall.yml'
      distro_name: qcom-robotics-distro-catchall
      target_type: '_full'
      target_yaml: 'ci/qcom-robotics-proprietary-image.yml'
      target_name: qcom-robotics-proprietary-image
      kernel_yaml: ''
      kernel_dirname: '_linux-qcom-next'
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      use_sstate: ${{ inputs.use_sstate || 'true' }}
      # keep in sync with the machines of the compile matrix
      fetch_machines: 'iq-8275-evk iq-9075-evk'

  compile:
    needs: [github-cache-check, compile_stage1, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      needs.github-cache-check.outputs.skip_build != 'true'
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: true
      matrix:
        machine:
          - iq-8275-evk
          - iq-9075-evk
        distro:
          - name: qcom-robotics-distro
            yamlfile: 'ci/qcom-robotics-distro.yml'
          - name: qcom-robotics-distro-catchall
            yamlfile: 'ci/qcom-robotics-distro-catchall.yml'
          - name: debug
            yamlfile: 'ci/qcom-robotics-distro-catchall.yml:ci/debug.yml'
          - name: performance
            yamlfile: 'ci/qcom-robotics-distro-catchall.yml:ci/performance.yml'
        target:
          - type: '_base'
            name: qcom-robotics-image
            yamlfile: 'ci/qcom-robotics-image.yml'
          - type: '_full'
            name: qcom-robotics-proprietary-image
            yamlfile: 'ci/qcom-robotics-proprietary-image.yml'
        kernel:
          - type: default
            dirname: '_linux-qcom-next'
            yamlfile: ''
        exclude:
          # built by compile_stage1
          - machine: iq-9075-evk
            distro:
              name: qcom-robotics-distro-catchall
              yamlfile: 'ci/qcom-robotics-distro-catchall.yml'
            target:
              type: '_full'
              name: qcom-robotics-proprietary-image
              yamlfile: 'ci/qcom-robotics-proprietary-image.yml'

    uses: ./.github/workflows/compile.yml
    with:
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      target_type: ${{matrix.target.type}}
      target_yaml: ${{matrix.target.yamlfile}}
      target_name: ${{matrix.target.name}}
      kernel_yaml: ${{matrix.kernel.yamlfile}}
      kernel_dirname: ${{matrix.kernel.dirname}}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      use_sstate: ${{ inputs.use_sstate || 'true' }}

  publish_summary:
    needs: [github-cache-check, compile_stage1, compile]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      needs.github-cache-check.outputs.skip_build != 'true'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - name: 'Download build URLs'
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*
          path: urlfiles
          merge-multiple: true

      - name: "Print output"
        shell: python
        id: print-output
        run: |
          import os
          ftable = {}
          oslist = set()
          machinelist = set()
          for fname in os.listdir("./urlfiles"):
              if fname.startswith("build-url"):
                  b, m, o = fname.split("_", 2)
                  oslist.add(o)
                  machinelist.add(m)
                  url = ""
                  with open(f"./urlfiles/{fname}", "r") as urlfile:
                      url = urlfile.read()
                  if not o in ftable:
                      ftable.update({o:{m: url}})
                  else:
                      ftable[o].update({m: url})

          table_str = "| |"

          for m in sorted(machinelist):
              table_str += f" {m} |"

          table_str += "\n|"
          for i in range(len(machinelist) + 1):
              table_str += " ---- |"

          table_str += "\n"

          for o in sorted(ftable.keys()):
              table_str += f"| {o} |"
              for m in sorted(machinelist):
                  url = ftable[o].get(m)
                  if url:
                      url = url.strip()
                      table_str += f" [Files]({url}/{o}/{m}/) |"
                  else:
                      table_str += " |"
              table_str += "\n"
          summary_file_name = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file_name:
              with open(summary_file_name, "a") as summaryfile:
                  summaryfile.write("## Download URLs\n")
                  summaryfile.write(table_str)
          print(table_str)

  github-cache-save:
    needs: [github-cache-check, compile_stage1, compile]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      inputs.skip_if_github_cached == true &&
      needs.github-cache-check.outputs.skip_build != 'true' &&
      needs.compile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create build success marker
        run: date -u +%FT%TZ > /tmp/build-success-marker

      - name: Save successful build marker to github cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ needs.github-cache-check.outputs.run_hash }}

  build_successful:
    if: github.repository_owner == 'qualcomm-linux'
    needs: [compile_stage1, compile]
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        run: |
          echo "All compile matrix jobs succeeded and artifacts uploaded to S3 bucket"
