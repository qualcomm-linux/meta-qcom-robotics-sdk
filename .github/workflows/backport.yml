name: Backport merged pull request
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write # so it can comment
  pull-requests: write # so it can create pull requests
jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest
    # Don't run on closed unmerged pull requests
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - uses: actions/checkout@v6
      - name: Create backport pull requests
        id: backport
        uses: korthout/backport-action@7c3f6cd5843cac11bc59a04a1b7699af93261670 # 4.5.0
        with:
          github_token: ${{ secrets.SDK_LAYER_TOKEN }}
          label_pattern: "^backport (wrynose)$"
          branch_name: "backport/${pull_number}-to-${target_branch}"

      - name: Collect notification recipients
        id: recipients
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SDK_LAYER_TOKEN }}
          FALLBACK_EMAILS: ${{ secrets.BACKPORT_NOTIFY_EMAILS }}
        run: |
          emails=""

          # Fetch PR owner email via GitHub API
          pr_login="${{ github.event.pull_request.user.login }}"
          pr_email=$(gh api "users/${pr_login}" --jq '.email // empty' 2>/dev/null || true)
          [ -n "$pr_email" ] && emails="$pr_email"

          # Fetch CODEOWNERS emails via GitHub API; skip PR owner (already added)
          if [ -f ".github/CODEOWNERS" ]; then
            while IFS= read -r login; do
              [ "$login" = "$pr_login" ] && continue
              email=$(gh api "users/${login}" --jq '.email // empty' 2>/dev/null || true)
              [ -n "$email" ] && emails="${emails:+${emails},}${email}"
            done < <(grep -oP '@\K[a-zA-Z0-9-]+' .github/CODEOWNERS | sort -u)
          fi

          # Fall back to an explicitly configured recipient list when GitHub
          # profiles do not expose public email addresses.
          if [ -z "$emails" ] && [ -n "$FALLBACK_EMAILS" ]; then
            emails="$FALLBACK_EMAILS"
          fi

          echo "emails=${emails}" >> "$GITHUB_OUTPUT"

      - name: Send backport failure notification
        if: failure() && steps.recipients.result == 'success' && steps.recipients.outputs.emails != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || '587' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[meta-qcom-robotics-sdk] Backport failed for PR #${{ github.event.pull_request.number }}"
          to: ${{ steps.recipients.outputs.emails }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Backport failed for PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            PR Author : @${{ github.event.pull_request.user.login }}
            PR URL    : ${{ github.event.pull_request.html_url }}
            Repository: ${{ github.repository }}

            The automatic backport could not be applied cleanly.
            Please create the backport manually or resolve any conflicts.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
