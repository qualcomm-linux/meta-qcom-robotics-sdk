name: Nightly Build
run-name: "Nightly Build (${{ github.ref_name }})"

on: 
  schedule:
  # NOTE - changes to the cron spec should be pushed by https://github.com/quic-yocto-ci
  # so that build notification emails will be sent out properly.
  - cron: "00 10 * * *"   # daily job - pick a random "minute"  - top of hour can be busy in github

  workflow_dispatch:
    inputs:
      use_sstate:
        description: "Use SSTATE cache"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build-nightly:
    permissions:
      contents: read
      packages: read
      actions: read
    uses: $/.github/workflows/build-yocto.yml
    with:
      use_sstate: ${{ inputs.use_sstate || 'true' }}
      # a full rebuild (use_sstate false) runs even when nothing changed
      skip_if_github_cached: ${{ inputs.use_sstate != 'false' }}
  test-nightly:
    if: needs.build-nightly.outputs.build_skipped != 'true'
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test.yml
    needs: build-nightly
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: ${{ github.run_id }}
  publish-test-results:
    if: needs.build-nightly.outputs.build_skipped != 'true'
    permissions:
      contents: read
      packages: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/publish-results.yml
    needs: [build-nightly, test-nightly]
    secrets:
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
    with:
      workflow_id: ${{ github.run_id }}
      event_name: ${{ github.event_name }}
      event_file: ${{ github.event_path }}
      commit: ${{ github.sha }}
