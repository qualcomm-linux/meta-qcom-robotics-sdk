name: Run kas for a specific build configuration
inputs:
  machine:
    required: true
  distro_yaml:
    required: true
  distro_name:
    required: true
  target_type:
    description: "Type of the target to build (e.g. base, full)"
    required: true
  target_yaml:
    description: "Path to the target YAML file relative to the distro YAML file"
    required: true
  target_name:
    description: "Name of the target to build"
    required: true
  kernel_yaml:
    required: true
  kernel_dirname:
    required: true
  cache_dir:
    required: true
  use_sstate:
    required: false
    default: "true"
  fetch_machines:
    description: "Machines to fetch the sources of all the compile jobs for, before the build"
    required: false
    default: ""
outputs:
  url:
    description: Location of the published binaries
    value: ${{ steps.upload_s3_artifacts.outputs.url }}
runs:
  using: "composite"
  steps:
    - name: Download kas
      uses: actions/download-artifact@v7
      with:
        name: kas

    - name: Setting up kas-container
      shell: bash
      run: |
        chmod +x $KAS_CONTAINER

    - name: Setup build variables and sstate-cache
      shell: bash
      run: |
        INPUTS_CACHE_DIR="${{ inputs.cache_dir }}"
        DL_DIR="${INPUTS_CACHE_DIR}/downloads"
        KAS_WORK_DIR="${PWD}/../kas"

        echo "INPUTS_CACHE_DIR=${INPUTS_CACHE_DIR}" >> "$GITHUB_ENV"
        echo "DL_DIR=${DL_DIR}" >> "$GITHUB_ENV"
        echo "KAS_WORK_DIR=${KAS_WORK_DIR}" >> "$GITHUB_ENV"

        echo "Cache directory: ${INPUTS_CACHE_DIR}"
        ls -ald "${INPUTS_CACHE_DIR}"

        if [[ "${{ inputs.use_sstate }}" == "false" ]]; then
          echo "Not using SSTATE cache (full rebuild)."
        else
          # use a single shared sstate cache folder, cleaned up by mtime
          SSTATE_DIR="${INPUTS_CACHE_DIR}/sstate-cache"
          echo "Using SSTATE cache: ${SSTATE_DIR}"
          echo "SSTATE_DIR=${SSTATE_DIR}" >> "$GITHUB_ENV"
        fi
        
        echo "KAS_YAMLS=ci/ci.yml:ci/mirror.yml:ci/build-id.yml:ci/${{ inputs.machine }}.yml:${{ inputs.distro_yaml }}:${{ inputs.target_yaml }}:${{ inputs.kernel_yaml }}" >> $GITHUB_ENV

        # kas-container does not forward arbitrary env vars into the
        # container, so bake the CI run id into a kas fragment inside the
        # mounted checkout. This overrides the local default set in
        # ci/base.yml so the image's /etc/os-release maps back to the run
        # (and to the S3 artifact folder named ${run_id}-${run_attempt}).
        cat > ci/build-id.yml <<EOF
        header:
          version: 14
        local_conf_header:
          build-id: |
            BUILD_ID = "${BUILD_ID}"
        EOF
      env:
        BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    - name: Dump kas-build yaml
      shell: bash
      run: |
        mkdir -p $KAS_WORK_DIR
        $KAS_CONTAINER dump --resolve-env --resolve-local --resolve-refs ${KAS_YAMLS} > kas-build.yml
        echo "==== kas-build.yml contents start ===="
        cat kas-build.yml
        echo "==== kas-build.yml contents end ===="

    - name: Kas fetch sources
      if: inputs.fetch_machines != ''
      shell: bash
      run: |
        # Download the sources of all the compile jobs once, before they write
        # the same files into the shared DL_DIR at the same time. One machine
        # at a time, and with the catchall distro that covers the recipes of
        # the other distros.
        for machine in ${INPUTS_FETCH_MACHINES}; do
          $KAS_CONTAINER shell ci/ci.yml:ci/mirror.yml:ci/${machine}.yml:ci/qcom-robotics-distro-catchall.yml --command "\
          bitbake --runall=fetch \
            qcom-robotics-image qcom-robotics-image:do_generate_qirp_sdk \
            qcom-robotics-proprietary-image qcom-robotics-proprietary-image:do_generate_qirp_sdk"
        done
      env:
        INPUTS_FETCH_MACHINES: ${{ inputs.fetch_machines }}

    - name: Kas fetch sources (buildstats)
      if: inputs.fetch_machines != ''
      shell: bash
      run: |
        ci/kas-container-shell-helper.sh ci/yocto-buildstats.sh
        rename.ul -va buildstats buildstats-fetch $KAS_WORK_DIR/build/buildstats*
        mv $KAS_WORK_DIR/build/buildstats* .

    - name: Kas build images and QIR SDK
      shell: bash
      run: |
        $KAS_CONTAINER shell ${KAS_YAMLS} --command "\
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gfortran ccache && \
        bitbake ${{ inputs.target_name }} && bitbake ${{ inputs.target_name }} -c generate_qirp_sdk"

    - name: Kas build images (buildstats)
      shell: bash
      run: |
        ci/kas-container-shell-helper.sh ci/yocto-buildstats.sh
        mv $KAS_WORK_DIR/build/buildstats* .
    
    - name: Stage build artifacts for publishing
      shell: bash
      run: |
        set -x
        # The upload-private-artifact-action runs from a container that
        # expects file to be relative to our PWD. deploy_dir is outside
        # that, so we move things around:
        echo "Current workdir: $(pwd)"
        deploy_dir=../kas/build/tmp/deploy
        images_dir=$deploy_dir/images/${{inputs.machine}}
        uploads_dir=./uploads/${{ inputs.distro_name }}${{ inputs.target_type }}${{ inputs.kernel_dirname }}/${{ inputs.machine }}
        mkdir -p $uploads_dir

        if [ -d $images_dir ]; then
          echo "==== Build image files start ===="
          ls -al $images_dir
          echo "==== Build image files end ===="
          
          find $images_dir/ -maxdepth 1 -type f -exec cp {} $uploads_dir/ \;
          find $images_dir/ -maxdepth 1 -type l \( -name boot-*.img -o -name *.rootfs.ext4.gz -o -name *.rootfs.qcomflash.tar.gz \) -exec cp -d {} $uploads_dir/ \;
        else
          echo "WARNING: No build image files found!"
        fi
        cp -v buildstats* kas-build.yml $uploads_dir/
    
    - name: Stage qirp-sdk artifacts for publishing
      shell: bash
      run: |
        echo "Current workdir: $(pwd)"
        deploy_dir=../kas/build/tmp/deploy
        sdk_dir=$deploy_dir/qirpsdk_artifacts/${{ inputs.machine }}
        uploads_dir=./uploads/${{ inputs.distro_name }}${{ inputs.target_type }}${{ inputs.kernel_dirname }}/${{ inputs.machine }}

        if [ -d $sdk_dir ]; then
          echo "QIRP-SDK files: "
          ls -al $sdk_dir
          mkdir -p $uploads_dir
          find $sdk_dir/ -maxdepth 1 -type f -name "qirp-sdk_*.tar.gz" -printf "%f\n" | xargs tar -czf $uploads_dir/qirp_sdk.tar.gz -C $sdk_dir
        else
          echo "WARNING: No QIRP-SDK files found!"
        fi

    - name: Upload artifacts to S3 bucket
      uses: qualcomm-linux/upload-private-artifact-action@aws-v4
      id: upload_s3_artifacts
      with:
        path: ./uploads
        destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
        s3_bucket: qcom-prd-gh-artifacts

    - name: "Print output"
      shell: bash
      id: print-output
      run: |
        KERNEL_DIRNAME="${{ inputs.kernel_dirname }}"
        BUILDNAME="${{ inputs.machine }}_${{ inputs.distro_name }}${{ inputs.target_type }}${KERNEL_DIRNAME}"
        FILENAME="build-url_${BUILDNAME}"
        echo "${{ steps.upload_s3_artifacts.outputs.url }}" > "${FILENAME}"
        echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
      env:
        INPUTS_KERNEL_DIRNAME: ${{ inputs.kernel_dirname }}
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_NAME: ${{ inputs.distro_name }}
        
    - name: Upload build URL
      uses: actions/upload-artifact@v6
      with:
        overwrite: true
        name: ${{ steps.print-output.outputs.filename }}
        path: ${{ steps.print-output.outputs.filename }}
