name: Run kas for a specific build configuration
description: "Runs a kas build for a specific machine, distro, and target configuration"
inputs:
  machine:
    description: "The target machine to build for (e.g. qcs9100-ride-sx)"
    required: true
  distro_yaml:
    description: "Path to the distro YAML file"
    required: true
  distro_name:
    description: "Name of the distro to build"
    required: true
  kernel_yaml:
    description: "Path to the kernel YAML file"
    required: true
  kernel_dirname:
    description: "Directory name of the kernel"
    required: true
  cache_dir:
    description: "Path to the shared cache directory (downloads + sstate)"
    required: true
  use_sstate:
    description: "Whether to use the sstate cache (set to false for a full rebuild)"
    required: false
    default: "true"
outputs:
  url:
    description: Location of the published binaries
    value: ${{ steps.upload_artifacts.outputs.url }}
runs:
  using: "composite"
  steps:
    # - name: Download kas lockfile
    #   uses: actions/download-artifact@v7
    #   with:
    #     name: kas-lockfile
    #     path: ci/

    - name: Download kas-container
      uses: actions/download-artifact@v7
      with:
         name: kas-container
         path: ${{runner.temp}}

    - name: Setting up kas-container
      shell: bash
      run: |
        KAS_CONTAINER=$RUNNER_TEMP/kas-container
        chmod +x $KAS_CONTAINER
        echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV

    - name: Setup build variables and sstate-cache
      shell: bash
      env:
        INPUTS_CACHE_DIR: ${{ inputs.cache_dir }}
        INPUTS_USE_SSTATE: ${{ inputs.use_sstate }}
      run: |
        # Validate inputs: reject values containing newlines or path traversal
        if printf '%s' "$INPUTS_CACHE_DIR" | grep -qP '[\r\n]|\.\.'; then
          echo "ERROR: cache_dir input contains invalid characters" >&2
          exit 1
        fi
        if printf '%s' "$INPUTS_USE_SSTATE" | grep -qP '[\r\n]'; then
          echo "ERROR: use_sstate input contains invalid characters" >&2
          exit 1
        fi

        # use a monthly sstate cache folder
        echo "DL_DIR=${INPUTS_CACHE_DIR}/downloads" >> $GITHUB_ENV

        if [ "$INPUTS_USE_SSTATE" = "false" ]; then
          echo "Not using SSTATE cache (full rebuild)."
        else
          echo "Using SSTATE cache..."
          echo "SSTATE_DIR=${INPUTS_CACHE_DIR}/sstate-cache-$(date '+%Y-%m')" >> $GITHUB_ENV
        fi

        echo "KAS_WORK_DIR=$PWD/../kas" >> $GITHUB_ENV
        echo "SSTATE_DIR PATH: "
        ls -al /efs/qli/meta-qcom-robotics-sdk

    - name: Dump kas-build yaml
      shell: bash
      env:
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_YAML: ${{ inputs.distro_yaml }}
        INPUTS_KERNEL_YAML: ${{ inputs.kernel_yaml }}
      run: |
        mkdir $KAS_WORK_DIR
        $KAS_CONTAINER dump --resolve-env --resolve-local --resolve-refs \
          ci/mirror.yml:ci/${INPUTS_MACHINE}.yml${INPUTS_DISTRO_YAML}${INPUTS_KERNEL_YAML} > kas-build.yml
        echo "==== kas-build.yml contents: ===="
        cat kas-build.yml

    - name: Kas build images
      shell: bash
      env:
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_YAML: ${{ inputs.distro_yaml }}
        INPUTS_KERNEL_YAML: ${{ inputs.kernel_yaml }}
      run: |
        $KAS_CONTAINER shell ci/mirror.yml:ci/${INPUTS_MACHINE}.yml${INPUTS_DISTRO_YAML}${INPUTS_KERNEL_YAML} --command "\
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gfortran && \
        bitbake -c build qcom-robotics-image && \
        bitbake -c build qcom-robotics-proprietary-image && \
        bitbake -c generate_qirp_sdk qcom-robotics-proprietary-image "

        ci/kas-container-shell-helper.sh ci/yocto-pybootchartgui.sh
        mv $KAS_WORK_DIR/build/buildchart.svg .

    - uses: actions/upload-artifact@v6
      with:
        name: buildchart-${{ inputs.distro_name }}-${{ inputs.kernel_dirname }}-${{ inputs.machine }}
        path: |
          buildchart.svg
          buildchart-world.svg

    - uses: actions/upload-artifact@v6
      with:
        name: kas-build-${{ inputs.distro_name }}-${{ inputs.kernel_dirname }}-${{ inputs.machine }}
        path: kas-build.yml

    - name: Stage build artifacts for publishing
      shell: bash
      env:
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_NAME: ${{ inputs.distro_name }}
        INPUTS_KERNEL_DIRNAME: ${{ inputs.kernel_dirname }}
      run: |
        # The upload-private-artifact-action runs from a container that
        # expects file to be relative to our PWD. deploy_dir is outside
        # that, so we move things around:
        echo "Current workdir: $(pwd)"
        if [ -d "../kas/build/tmp/deploy/images/${INPUTS_MACHINE}" ]; then
          echo "Build image files: "
          ls "../kas/build/tmp/deploy/images/${INPUTS_MACHINE}"
          deploy_dir="../kas/build/tmp/deploy/images/${INPUTS_MACHINE}"
          uploads_dir="./uploads/${INPUTS_DISTRO_NAME}${INPUTS_KERNEL_DIRNAME}/${INPUTS_MACHINE}"
          mkdir -p "$uploads_dir"
          find "$deploy_dir/" -maxdepth 1 -type f -exec cp {} "$uploads_dir/" \;
          find "$deploy_dir/" -maxdepth 1 -type l \( -name boot-*.img -o -name *.rootfs.ext4.gz -o -name *.rootfs.qcomflash.tar.gz \) -exec cp -d {} "$uploads_dir/" \;
          cp buildchart.svg kas-build.yml "$uploads_dir/"
        else
          echo "WARNING: No build image files found!"
        fi

    - name: Stage qirp-sdk artifacts for publishing
      shell: bash
      env:
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_NAME: ${{ inputs.distro_name }}
        INPUTS_KERNEL_DIRNAME: ${{ inputs.kernel_dirname }}
      run: |
        echo "Current workdir: $(pwd)"
        if [ -d "../kas/build/tmp/deploy/qirpsdk_artifacts/${INPUTS_MACHINE}" ]; then
          echo "QIRP-SDK files: "
          ls "../kas/build/tmp/deploy/qirpsdk_artifacts/${INPUTS_MACHINE}"
          sdk_dir="../kas/build/tmp/deploy/qirpsdk_artifacts/${INPUTS_MACHINE}"
          uploads_dir="./uploads/${INPUTS_DISTRO_NAME}${INPUTS_KERNEL_DIRNAME}/${INPUTS_MACHINE}"
          mkdir -p "$uploads_dir"
          # Pack each SDK into its own archive with a stable name (no version
          # suffix) so consumers always find the same filename regardless of the
          # SDK_VERSION that was used to build it.
          oss_src=$(find "$sdk_dir/" -maxdepth 1 -type f -name "qirp-sdk_*.tar.gz" | head -1)
          if [ -n "$oss_src" ]; then
            tar -czf "$uploads_dir/qirp-sdk.tar.gz" -C "$sdk_dir" "$(basename "$oss_src")"
          fi
          prop_src=$(find "$sdk_dir/" -maxdepth 1 -type f -name "qirp-proprietary-sdk_*.tar.gz" | head -1)
          if [ -n "$prop_src" ]; then
            tar -czf "$uploads_dir/qirp-proprietary-sdk.tar.gz" -C "$sdk_dir" "$(basename "$prop_src")"
          fi
          if [ -z "$oss_src" ] && [ -z "$prop_src" ]; then
            echo "WARNING: No QIRP-SDK tarballs found in $sdk_dir"
          fi
        else
          echo "WARNING: No QIRP-SDK files found!"
        fi

    - name: Upload artifacts to S3 bucket
      uses: qualcomm-linux/upload-private-artifact-action@aws-v4
      id: upload_s3_artifacts
      with:
        path: ./uploads
        destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
        s3_bucket: qcom-prd-gh-artifacts

    - name: "Print output"
      shell: bash
      id: print-output
      env:
        INPUTS_KERNEL_DIRNAME: ${{ inputs.kernel_dirname }}
        INPUTS_MACHINE: ${{ inputs.machine }}
        INPUTS_DISTRO_NAME: ${{ inputs.distro_name }}
        UPLOAD_URL: ${{ steps.upload_s3_artifacts.outputs.url }}
      run: |
        BUILDNAME="${INPUTS_MACHINE}_${INPUTS_DISTRO_NAME}${INPUTS_KERNEL_DIRNAME}"
        FILENAME="build-url_${BUILDNAME}"
        echo "${UPLOAD_URL}" > "${FILENAME}"
        echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

    - name: Upload build URL
      uses: actions/upload-artifact@v6
      with:
        overwrite: true
        name: ${{ steps.print-output.outputs.filename }}
        path: ${{ steps.print-output.outputs.filename }}